name: CI/CD Docker

on:
  push:
    branches: [ main ]

env:
  # 프로젝트 이름만 정의 (모두 소문자로 작성하세요)
  IMAGE_NAME: arto-fe-deploy
  CONTAINER_NAME: go_cicd

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 로그인 (이 단계가 먼저 오는 것이 안전합니다)
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 2. 계정명을 소문자로 변환하여 전체 이미지 주소 생성
      - name: Set Docker Image Path
        id: image_path
        run: |
          # 사용자 계정명을 소문자로 변환
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # 전체 경로를 환경 변수에 저장
          echo "FULL_IMAGE_NAME=ghcr.io/$OWNER/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      # 3. 빌드 및 푸시
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 위에서 생성한 FULL_IMAGE_NAME 변수 사용
          tags: ${{ env.FULL_IMAGE_NAME }}:latest
          # 빌드 캐시 설정 (속도 향상)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    name: Deploy
    runs-on: [ self-hosted, label-go ]
    steps:
      # 배포 단계에서도 이미지 주소 생성이 필요합니다.
      - name: Set Docker Image Path
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "FULL_IMAGE_NAME=ghcr.io/$OWNER/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker run
        run: |
          # 기존 컨테이너 중지 및 삭제 (에러 무시)
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
          # 기존 이미지 삭제 (용량 확보)
          docker rmi ${{ env.FULL_IMAGE_NAME }}:latest || true
          # 새 컨테이너 실행
          docker run -d -p 80:3000 \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            ${{ env.FULL_IMAGE_NAME }}:latest
