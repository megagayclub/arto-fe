name: CI/CD Docker

on:
  push:
    branches: [ main ]

env:
  # 기본 이미지 이름 (계정명 제외)
  IMAGE_BASE_NAME: arto-fe-deploy
  NAME: go_cicd

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 대문자가 섞일 수 있는 계정명을 소문자로 변환하여 환경 변수에 저장
      - name: Set lower case owner name
        run: |
          echo "DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_BASE_NAME }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set up docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          # 변환된 소문자 환경 변수 사용
          tags: ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # 캐시 정리를 위한 추가 단계 (선택 사항)
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    needs: build
    name: Deploy
    runs-on: [ self-hosted, label-go ]
    steps:
      # 배포 단계에서도 소문자 변환이 필요합니다.
      - name: Set lower case owner name
        run: |
          echo "DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_BASE_NAME }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker run
        run: |
          # 기존 컨테이너가 없을 경우 에러 방지를 위해 || true 추가
          docker stop ${{ env.NAME }} || true && docker rm ${{ env.NAME }} || true
          docker rmi ${{ env.DOCKER_IMAGE }}:latest || true
          docker run -d -p 80:3000 --name ${{ env.NAME }} --restart always ${{ env.DOCKER_IMAGE }}:latest
