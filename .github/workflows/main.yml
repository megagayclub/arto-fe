name: CI/CD Docker

on:
  push:
    branches: [main]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/arto-fe-deploy
  VERSION: ${{ github.sha }}
  NAME: go_cicd

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    name: Deploy
    runs-on: [self-hosted, label-go]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker deploy
        run: |
          # 1. 기존 컨테이너 및 쓰레기 이미지 정리 (용량 확보 및 꼬임 방지)
          docker stop ${{ env.NAME }} 2>/dev/null || true
          docker rm ${{ env.NAME }} 2>/dev/null || true
          docker image prune -f

          # 2. 최신 이미지 가져오기
          docker pull ${{ env.DOCKER_IMAGE }}:latest

          # 3. [중요] Nginx 기반으로 실행하므로 내부 포트를 80으로 연결
          # 외부 81번 -> 컨테이너 80번
          docker run -d \
            --name ${{ env.NAME }} \
            -p 81:80 \
            --restart always \
            ${{ env.DOCKER_IMAGE }}:latest
