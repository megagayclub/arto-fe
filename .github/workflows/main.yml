name: CI/CD Docker

on:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/arto-fe-deploy
  VERSION: ${{ github.sha }}
  NAME: go_cicd

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest # 빌드는 깃허브 서버에서 안전하게 수행
    steps:
      - uses: actions/checkout@v4 # 최신 버전으로 업데이트 (set-output 경고 해결)
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    name: Deploy
    runs-on: [ self-hosted, label-go ]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker deploy
        run: |
          # 기존 컨테이너가 없어도 에러 나지 않도록 수정
          docker stop ${{ env.NAME }} 2>/dev/null || true
          docker rm ${{ env.NAME }} 2>/dev/null || true
          
          # 최신 이미지 가져오기
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          
          # Vite의 포트와 호스트 설정을 고려하여 실행 (81번 포트로 접속)
          # 아까 로그에서 5173번이 떴으므로 내부 포트를 5173으로 맞추는 것이 안전합니다.
          docker run -d \
            -p 81:5173 \
            --name ${{ env.NAME }} \
            --restart always \
            ${{ env.DOCKER_IMAGE }}:latest
