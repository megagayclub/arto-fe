# nginx.conf (프론트엔드 프로젝트 루트에 생성)
server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 요청을 백엔드 Docker 서비스로 포워딩
    location /api/v1/ {
        # 프론트엔드 코드에 설정한 Docker 서비스 이름과 포트
        proxy_pass http://arto-server:8080/api/v1/;

        # 🌟 [필수] Host 헤더를 설정하여 Tomcat 오류(The host is not valid) 해결
        proxy_set_header Host $host; 
        
        # 클라이언트 IP 주소 전달
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}